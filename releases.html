---
layout: column
title: Releases
permalink: /releases/
---

<h1 class="title-releases">Releases</h1>

<div class="releases-grid">
  {% assign sorted_releases = site.releases | sort: 'date' | reverse %}
  {% for release in sorted_releases %}
    <div class="release-item">
      <a href="{{ release.url | relative_url }}">
        <img src="{{ release.image | relative_url }}"
             alt="Portada de {{ release.title }}"
             width="1200"
             height="1200"
             {% if forloop.index0 < 3 %}loading="eager"{% else %}loading="lazy"{% endif %}
             decoding="async">
        <span class="release-title">{{ release.title }}</span>
      </a>
    </div>
  {% endfor %}
</div>

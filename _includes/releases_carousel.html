<div class="carousel" tabindex="0" role="region" aria-label="Carrusel de releases" aria-roledescription="carrusel">
  <div class="carousel-track">
    {% assign sorted_releases = site.releases | sort: "date" | reverse %}
    {% for release in sorted_releases limit:10 %}
      <div class="carousel-item"
           data-index="{{ forloop.index0 }}"
           role="group"
           aria-roledescription="slide"
           aria-label="{{ forloop.index }} de {{ sorted_releases.size | at_most: 10 }}: {{ release.title }}"
           {% unless forloop.first %}aria-hidden="true"{% endunless %}>
        <a href="{{ release.url }}"
           class="release-card"
           {% unless forloop.first %}tabindex="-1"{% endunless %}>
          <img src="{{ release.image | relative_url }}"
               alt="Portada de {{ release.title }}"
               width="1200"
               height="1200"
               {% if forloop.first %}loading="eager" fetchpriority="high"{% else %}loading="lazy"{% endif %}
               decoding="async">
          <div class="release-title">
            <h3>{{ release.title }}</h3>
          </div>
        </a>
      </div>
    {% endfor %}
  </div>
  <div class="carousel-dots">
    {% for release in sorted_releases limit:10 %}
      <button class="carousel-dot{% if forloop.index0 == 0 %} active{% endif %}"
              data-index="{{ forloop.index0 }}"
              aria-label="Ir a {{ release.title }}"></button>
    {% endfor %}
  </div>
  <div class="carousel-live sr-only" aria-live="polite" aria-atomic="true"></div>
</div>

{% if page.meta_pixel_id %}
<!-- Meta Pixel: {{ page.meta_campaign_name | default: page.title }} -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window,document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init','{{ page.meta_pixel_id }}');
fbq('track','PageView');
</script>
<noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id={{ page.meta_pixel_id }}&ev=PageView&noscript=1"
/></noscript>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var campaignName = {{ page.meta_campaign_name | default: page.title | jsonify }};
  document.querySelectorAll('[data-track-platform]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (typeof fbq === 'undefined') return;
      fbq('trackCustom', 'ClickToStream', {
        content_name: campaignName,
        platform: btn.dataset.trackPlatform
      });
    });
  });
});
</script>
<!-- End Meta Pixel -->
{% endif %}

title: YTS
author: YTS
description: >-
  YTS es un grupo musical de Viña del Mar, Chile, formado por Simón Miranda,
  Paul Spencer y Martín Campusano. Fusionan Hip-Hop, Bossa y sonidos
  alternativos. Aquí encontrarás sus releases, noticias y próximas fechas.
baseurl: "" # Deja esto vacío si es tu sitio principal
url: "https://ytsmusica.com"
lang: es-CL
logo: /assets/images/yts-logo-new.svg

# Datos para jekyll-seo-tag (Open Graph + JSON-LD).
# YTS no tiene cuenta en Twitter/X, así que no se declara el bloque `twitter:`:
# eso evita que el plugin emita <meta name="twitter:*">.
social:
  name: YTS
  links:
    - https://www.instagram.com/yts.group/
    - https://www.youtube.com/channel/UC7SauoubHXzZfilLRDCPm9g

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: "feed.xml" # Esto es opcional; jekyll-feed usa este nombre por defecto

# Habilitar la publicación de posts con fechas futuras
future: true

# Configuración de construcción
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  enable_coderay: false
  parse_block_html: true
  parse_span_html: true
  html_to_native: false

permalink: /:categories/:title/

# Sass stuff
sass:
  sass_dir: _sass
  style: compressed

# Excluir archivos y carpetas
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Colecciones
collections:
  releases:
    output: true
    permalink: /releases/:title/
  posts:
    output: true
    permalink: /news/:title/

# Valores predeterminados para el front matter
defaults:
  - scope:
      path: ""
      type: "releases"
    values:
      layout: "release"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      # Fallback social card para posts que no declaran imagen propia.
      image: /assets/images/releases/yendo-tras-suenos.jpg
  - scope:
      path: ""
    values:
      layout: "default"

# no github default theme
theme: null